name: Refresh World Squash Masters data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: world-squash-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Refresh tournament data
        env:
          SQUASHLEVELS_EMAIL: ${{ secrets.SQUASHLEVELS_EMAIL }}
          SQUASHLEVELS_PASSWORD: ${{ secrets.SQUASHLEVELS_PASSWORD }}
          HEADLESS: '0'
          # Optional later: these take precedence over email/password if you add them.
          SQUASHLEVELS_STORAGE_STATE_B64: ${{ secrets.SQUASHLEVELS_STORAGE_STATE_B64 }}
          SQUASHLEVELS_SESSION_STORAGE_B64: ${{ secrets.SQUASHLEVELS_SESSION_STORAGE_B64 }}
        run: xvfb-run --auto-servernum npm run refresh

      - name: Commit refreshed data
        shell: bash
        run: |
          if git diff --quiet -- data.js summary-data.js players-data.js matches-data.js vicpark-data.js; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js summary-data.js players-data.js matches-data.js vicpark-data.js
          git commit -m "Refresh tournament data"
          git push
