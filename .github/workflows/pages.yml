name: Refresh World Squash Masters latest results

on:
  workflow_dispatch:
  # Uncomment for scheduled quick refreshes.
  # schedule:
  #   - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: world-squash-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Refresh latest matches and Results page
        shell: bash
        env:
          HEADLESS: '1'
        run: |
          set -euo pipefail

          DATA_FILES="data.js summary-data.js players-data.js matches-data.js vicpark-data.js results-data.js"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ATTEMPT in 1 2; do
            echo ""
            echo "============================================================"
            echo "Quick refresh attempt $ATTEMPT of 2"
            echo "============================================================"

            git fetch origin main
            git reset --hard origin/main
            BASE_SHA="$(git rev-parse HEAD)"
            echo "Refresh base: $BASE_SHA"

            xvfb-run --auto-servernum npm run refresh:quick

            echo "Validating generated data files..."
            for FILE in $DATA_FILES; do
              if [ ! -s "$FILE" ]; then
                echo "::error::$FILE is missing or empty. Existing website data will NOT be replaced."
                exit 1
              fi
              node --check "$FILE"
            done

            if git diff --quiet -- $DATA_FILES; then
              echo "Quick refresh completed successfully; no data changes detected."
              exit 0
            fi

            git diff --stat -- $DATA_FILES

            git fetch origin main
            REMOTE_SHA="$(git rev-parse origin/main)"
            if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
              echo "::warning::main changed while refresh was running."
              if [ "$ATTEMPT" -lt 2 ]; then
                continue
              fi
              echo "::error::main changed again during retry. Refusing to overwrite newer data."
              exit 1
            fi

            git add $DATA_FILES
            git commit -m "Refresh latest matches and results"
            if git push origin HEAD:main; then
              echo "Quick refresh successfully published."
              exit 0
            fi

            if [ "$ATTEMPT" -lt 2 ]; then
              echo "::warning::Push raced with another update. Retrying."
              continue
            fi
            exit 1
          done
