<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Schedule · World Squash Masters 2026</title><style>/*__CSS__*/</style></head><body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><header class="topbar"><a class="brand" href="index.html#players"><div class="brand-mark">W</div><div><strong>WORLD SQUASH</strong><span>MASTERS 2026 <b class="edition-label">(VIC PARK SQUASH EDITION)</b></span></div></a><nav class="nav"><a href="index.html#players" class="nav-link">Players</a><a href="index.html#glass" class="nav-link">Glass Court</a><a href="index.html#vicpark" class="nav-link">Vic Park Matches</a></nav><a class="official-link" href="index.html#players">← Back</a></header><main><section class="player-detail-hero"><div id="playerHeader"></div></section><section class="schedule-section"><div class="section-head"><div><div class="eyebrow">FULL PLAYER SCHEDULE</div><h2>All tournament matches</h2><p>Upcoming fixtures and completed games from the same refreshed match dataset.</p></div></div><div id="playerSchedule"></div></section></main><script>/*__DATA__*/</script><script>
const data=window.TOURNAMENT_DATA, qs=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const basicNorm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").toLowerCase().replace(/[^a-z0-9']+/g,' ').trim();
const nameKey=s=>{let v=String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").trim();v=v.replace(/\[[^\]]*\]/g,' ').replace(/\((?:[A-Z]{2,3}|\d+)\)/g,' ').replace(/\b(?:AUS|ENG|SCO|WAL|SUI|NZL|USA|CAN|FRA|GER|DEU|IRL|RSA|IND|JPN|MAS|SGP|HKG)\b/gi,' ');if(v.includes(',')){const p=v.split(',').map(x=>x.trim()).filter(Boolean);if(p.length===2)v=p[1]+' '+p[0];}return v.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(Boolean).sort().join(' ')};
const sameName=(a,b)=>!!a&&!!b&&(basicNorm(a)===basicNorm(b)||nameKey(a)===nameKey(b));
const flatText=v=>{try{return typeof v==='string'?v:JSON.stringify(v)}catch{return String(v||'')}};
const playerNeedles=(data.players||[]).map(p=>({p,key:basicNorm(p.name)})).sort((a,b)=>b.key.length-a.key.length);
function canonicalDate(v){if(!v)return '';const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;const d=new Date(s);if(!Number.isNaN(d.getTime()))return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return s;}
function namesFromRecord(m){const text=' '+basicNorm(flatText(m))+' ';const found=[];for(const x of playerNeedles){if(x.key.length>4&&text.includes(' '+x.key+' ')){found.push(x.p.name);if(found.length===2)break}}return found}
function normMatch(m){const raw=flatText(m.rawText||m.text||m.description||m);let p1=m.player1||m.playerOne||m.homePlayer||m.home||m.participant1||m.team1||m.entry1||'',p2=m.player2||m.playerTwo||m.awayPlayer||m.away||m.participant2||m.team2||m.entry2||'';const gn=v=>typeof v==='object'&&v?(v.name||v.displayName||v.fullName||v.title||v.label||''):String(v||'');p1=gn(p1);p2=gn(p2);if(!p1||!p2){const f=namesFromRecord(m);if(!p1)p1=f[0]||'';if(!p2)p2=f.find(n=>!sameName(n,p1))||f[1]||''}let venue=m.venue||m.venueName||m.location||m.locationName||m.site||m.facility||'',court=m.court||m.courtName||m.resource||m.resourceName||m.field||m.fieldName||'';if(typeof venue==='object')venue=venue.name||venue.title||venue.label||'';if(typeof court==='object')court=court.name||court.title||court.label||'';if(!venue){if(/Karrinyup/i.test(raw))venue='Karrinyup Shopping Centre';else if(/Mirrabooka/i.test(raw))venue='Squashworld Mirrabooka'}if(!court){const cm=raw.match(/(?:court(?:Name)?["':\s]*|\b)(AGC|SC\s*\d+|Court\s*\d+|[A-Z]{2,5}\s*\d+)\b/i);if(cm)court=cm[1]}return {...m,date:canonicalDate(m.date||m.matchDate||m.startDate||m.start||m.datetime||m.dateTime||m.scheduledDate),time:m.time||m.matchTime||m.startTime||m.scheduledTime||'',event:m.event||m.eventName||m.draw||m.category||m.disciplineName||'',round:m.round||m.roundName||'',player1:p1,player2:p2,venue,court,rawText:raw}}
data.matches=(data.matches||[]).map(normMatch);
const requested=new URLSearchParams(location.search).get('name')||'';const p=data.players.find(x=>sameName(x.name,requested));const name=p?.name||requested;const flag=x=>x?.flagCode?`<img src="https://flagcdn.com/w160/${x.flagCode}.png" alt="${esc(x.country)} flag">`:'🌐';const fmt=d=>{const x=new Date(d+'T12:00:00');return Number.isNaN(x.getTime())?esc(d):x.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};const has=(m,n)=>sameName(m.player1,n)||sameName(m.player2,n);const opp=m=>sameName(m.player1,name)?m.player2:(sameName(m.player2,name)?m.player1:(namesFromRecord(m).find(n=>!sameName(n,name))||''));const pb=n=>data.players.find(x=>sameName(x.name,n));const past=m=>String(m.status||'').toLowerCase()==='completed'||String(m.status||'').toLowerCase()==='played'||!!m.result;
const venueCode=m=>{const place=[m.venue,m.court].filter(Boolean).join(' · ');if(/Karrinyup|\bAGC\b|Glass/i.test(place))return 'G';if(/Mirrabooka|Squashworld/i.test(place))return 'M';if(/Belmont|WA\s*State\s*Squash/i.test(place))return 'B';return '';};
const venueBadge=m=>{const c=venueCode(m);return c?`<span class="venue-letter venue-${c.toLowerCase()}">${c}</span>`:'';};
const venuePlace=m=>[m.venue,m.court].filter(Boolean).join(' · ')||'Venue / court TBD';
if(!p){qs('#playerHeader').innerHTML='<div class="schedule-empty">Player not found.</div>';qs('#playerSchedule').innerHTML='';}else{const ms=data.matches.filter(m=>has(m,name)).sort((a,b)=>`${a.date||''} ${a.time||''}`.localeCompare(`${b.date||''} ${b.time||''}`));qs('#playerHeader').innerHTML=`<div class="player-detail-card"><div class="player-detail-id">${flag(p)}<div><div class="eyebrow">${esc(p.country)} · ${esc(p.gender)} ${p.ageGroup}+</div><h1>${esc(p.name)}</h1></div></div><div class="status-chip">${ms.filter(m=>!past(m)).length} UPCOMING</div></div>`;const card=m=>{const o=opp(m),op=pb(o);return `<article class="tracked-match"><div class="tracked-match-top"><div><b>${fmt(m.date)}</b><span>${esc([m.event,m.round].filter(Boolean).join(' · '))}</span></div><strong>${esc(m.time||'TBD')}</strong></div><div class="player-match-fixture"><div class="player-match-side">${flag(p)}<b>${esc(name)}</b></div><div class="player-match-vs">VS</div><div class="player-match-side right"><b>${o?`<a href="player.html?name=${encodeURIComponent(o)}">${esc(o)}</a>`:'TBD'}</b>${flag(op)}</div></div><div class="player-match-meta"><span class="venue-block">${venueBadge(m)}<span>${esc(venuePlace(m))}</span></span>${m.result?`<span>${esc(m.result)}</span>`:''}<span class="result-pill ${past(m)?'completed':''}">${past(m)?'PAST':'UPCOMING'}</span></div></article>`};const up=ms.filter(m=>!past(m)),done=ms.filter(past);qs('#playerSchedule').innerHTML=`<div class="schedule-group"><h2>Upcoming / current</h2><div class="tracked-match-list">${up.length?up.map(card).join(''):'<div class="schedule-empty">No upcoming matches currently published.</div>'}</div></div><div class="schedule-group"><h2>Past games</h2><div class="tracked-match-list">${done.length?done.map(card).join(''):'<div class="schedule-empty">No completed matches yet.</div>'}</div></div>`;}
</script></body></html>
