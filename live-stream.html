<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Stream</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000}
</style>
</head>
<body>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const venueKey=String(params.get('venue')||'').toLowerCase();

  const wanted={
    karrinyup:'karrinyup',
    belmont:'belmont',
    mirrabooka:'mirrabooka'
  }[venueKey];

  if(!wanted)return;

  fetch('live-streams.json?_='+Date.now(),{cache:'no-store'})
    .then(r=>{
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(json=>{
      const rows=Array.isArray(json&&json.streams)?json.streams:[];

      const row=rows.find(x=>{
        const venue=String(x&&x.venue||'').toLowerCase();
        return venue.includes(wanted);
      });

      const raw=String(row&&row.url||'').trim();
      const match=raw.match(/https:\/\/\S+/i);
      if(!match)return;

      location.replace(match[0]);
    })
    .catch(()=>{});
})();
</script>
</body>
</html>
